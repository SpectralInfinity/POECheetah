[package]
name = "poecheetah"
version = "0.1.0"
description = "POECheetah: Path of Exile build and farming advisor"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "poecheetah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
