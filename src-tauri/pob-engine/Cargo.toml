[package]
name = "pob-engine"
version = "0.1.0"
description = "Path of Building Community run headless in embedded LuaJIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
mlua = { version = "0.11", features = ["luajit", "vendored", "serialize"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cc = "1"
