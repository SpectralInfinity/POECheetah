name: CI

# Pull requests come from claude/** branches, whose push runs already report
# on the PR; a pull_request trigger would run everything twice.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish GitHub Release v<app version> from this commit (main only)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    outputs:
      pob-key: ${{ steps.pob-key.outputs.key }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Git on the Windows runner fails to fetch PoB's files on demand, so the
      # Windows job restores this cache. Caches don't count toward the
      # account's artifact storage (500 MB on a free plan); artifacts do.
      # Computed here and handed to the Windows job: hashFiles() there sees
      # CRLF checkouts and would give another key.
      - name: Path of Building cache key
        id: pob-key
        run: echo "key=pob-$(tr -d '[:space:]' < src-tauri/pob-version.txt)-$(sha256sum scripts/fetch-pob.sh | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Path of Building
        uses: actions/cache@v4
        with:
          path: src-tauri/pob
          key: ${{ steps.pob-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Fetch Path of Building
        shell: bash
        run: ./scripts/fetch-pob.sh

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Rust tests (including the Path of Building engine)
        working-directory: src-tauri
        env:
          REQUIRE_POB: "1"
        run: cargo test --workspace --locked

  windows-installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # create a GitHub Release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Path of Building (cached by the Linux job)
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/pob
          key: ${{ needs.test.outputs.pob-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - run: npm ci

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}"
            exit 1
          fi

      - name: Build installer
        run: npm run tauri build

      # The installer for trying a branch: the setup .exe only (the .msi holds
      # the same app), kept a few days. Releases keep both, and release files
      # don't count toward artifact storage.
      - uses: actions/upload-artifact@v4
        with:
          name: poecheetah-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      # A v* tag push publishes a release. So does running this workflow by hand
      # on main with "release" ticked (for environments that can't push tags):
      # the release creates the v<version> tag on this commit.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
